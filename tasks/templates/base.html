<!DOCTYPE html>
<html>
<head>
        <title>Team Tasks</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
                body { background: #f8f9fa; }
                .calendar-heatmap div { transition: background 0.2s; }
                .navbar-brand { font-weight: bold; }
        </style>
</head>
<body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">Team Tasks</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                                    {% if user.is_authenticated %}
                                        <li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li>
                                        <li class="nav-item"><a class="nav-link" href="/logout/">Logout</a></li>
                                    {% else %}
                                        <li class="nav-item"><a class="nav-link" href="/accounts/login/">Login</a></li>
                                        <li class="nav-item"><a class="nav-link" href="/accounts/signup/">Sign Up</a></li>
                                    {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
